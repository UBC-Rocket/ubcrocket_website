<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UBC Rocket photo gallery for a specific year">
    <title>UBC Rocket Photos - Year</title>
    <!-- Main site styles -->
    <link href="./css/styles_.css" rel="stylesheet" />
    <link href="./css/year.css" rel="stylesheet" />
</head>
<body>
    <!-- Header -->
    <header class="year-header">
        <h1 id="yearTitle">UBC Rocket Photos</h1>
        <a href="gallery.html" class="back-link">← Back to Yearly Gallery</a>
    </header>

    <!-- Main Content -->
    <main class="container" aria-live="polite">
        <div id="yearSections"></div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; 2025 UBC Rocket. All rights reserved.</p>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
        <button class="lightbox-close" id="lightboxClose" aria-label="Close lightbox">&times;</button>
        <img id="lightboxImg" src="" alt="">
    </div>

    <!-- JavaScript -->
    <script>
        (function() {
            'use strict';

            const sectionsContainer = document.getElementById('yearSections');
            const yearTitleEl = document.getElementById('yearTitle');

            // Get year from query parameter
            const urlParams = new URLSearchParams(window.location.search);
            const year = urlParams.get('y') || '2024-2025';

            // Update page chrome based on the selected year
            document.title = `UBC Rocket Photos - ${year}`;
            yearTitleEl.textContent = `${year} UBC Rocket Photos`;

            // Generate placeholder SVGs with different colors
            const colors = [
                ['#4a90e2', '#50c9c3'], 
                ['#ff6b6b', '#feca57'], 
                ['#48dbfb', '#0abde3'], 
                ['#ee5a6f', '#f368e0'], 
                ['#00d2d3', '#54a0ff'], 
                ['#1dd1a1', '#10ac84'], 
                ['#ff9ff3', '#feca57'],
                ['#5f27cd', '#341f97'],
                ['#00d2d3', '#1dd1a1']  
            ];

            function createPlaceholderSVG(label, index) {
                const colorPair = colors[index % colors.length];
                const safeLabel = label.replace(/&/g, '&amp;');
                return `data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"%3E%3Cdefs%3E%3ClinearGradient id="grad${index}" x1="0%25" y1="0%25" x2="100%25" y2="100%25"%3E%3Cstop offset="0%25" style="stop-color:${colorPair[0].replace('#', '%23')};stop-opacity:1" /%3E%3Cstop offset="100%25" style="stop-color:${colorPair[1].replace('#', '%23')};stop-opacity:1" /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width="800" height="600" fill="url(%23grad${index})"/%3E%3Ctext x="50%25" y="50%25" dominant-baseline="middle" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.9"%3E${safeLabel}%3C/text%3E%3C/svg%3E`;
            }

            const YEAR_DATA = {
                "2024-2025": {
                    sections: [
                        {
                            title: "International Rocket Engineering Competition (IREC)",
                            photos: [
                                { src: createPlaceholderSVG('IREC pad prep', 0), alt: 'Team performing pad preparations for IREC 2024' },
                                { src: createPlaceholderSVG('IREC systems check', 1), alt: 'Avionics team running pre-launch systems checks' },
                                { src: createPlaceholderSVG('IREC ascent', 2), alt: 'Rocket ascending during IREC qualification flight' }
                            ]
                        },
                        {
                            title: "Launch Canada Rocketry Competition (LC)",
                            photos: [
                                { src: createPlaceholderSVG('LC fabrication', 3), alt: 'Composite layup work ahead of Launch Canada' },
                                { src: createPlaceholderSVG('LC launch rail', 4), alt: 'Booster mounted on the launch rail for LC competition' },
                                { src: createPlaceholderSVG('LC recovery', 5), alt: 'Recovery team posing with vehicle after LC flight' }
                            ]
                        },
                        {
                            title: "General UBC Rocket Photos",
                            photos: [
                                { src: createPlaceholderSVG('Design review', 6), alt: 'Students presenting propulsion updates during design review' },
                                { src: createPlaceholderSVG('Subsystem collaboration', 7), alt: 'Structures and avionics subteams collaborating in the lab' },
                                { src: createPlaceholderSVG('Outreach event', 8), alt: 'UBC Rocket outreach display on campus' }
                            ]
                        }
                    ]
                }
            };

            // Create photo element
            function createPhotoElement(src, alt, index) {
                const div = document.createElement('div');
                div.className = 'photo-item';

                const img = document.createElement('img');
                img.src = src;
                img.alt = alt;
                img.width = 800;
                img.height = 600;
                img.loading = 'lazy';
                img.decoding = 'async';
                img.style.background = '#eee';
                img.dataset.fullSrc = src;

                div.appendChild(img);
                div.addEventListener('click', function() {
                    openLightbox(src, alt);
                });

                return div;
            }

            function renderSections(yearInfo) {
                sectionsContainer.innerHTML = '';
                if (!yearInfo || !Array.isArray(yearInfo.sections) || !yearInfo.sections.length) {
                    sectionsContainer.innerHTML = `<p class="empty-state">We don't have any gallery entries for ${year} yet. Please check back soon.</p>`;
                    return;
                }

                yearInfo.sections.forEach((section, sectionIndex) => {
                    const sectionEl = document.createElement('section');
                    sectionEl.className = 'section';

                    const heading = document.createElement('h2');
                    heading.textContent = `${section.title} ${year}`;
                    sectionEl.appendChild(heading);

                    const grid = document.createElement('div');
                    grid.className = 'photo-grid';
                    sectionEl.appendChild(grid);

                    section.photos.forEach((photo, photoIndex) => {
                        const altText = photo.alt || `${section.title} photo ${photoIndex + 1} from ${year}`;
                        grid.appendChild(createPhotoElement(photo.src, altText, sectionIndex * 10 + photoIndex));
                    });

                    sectionsContainer.appendChild(sectionEl);
                });
            }

            renderSections(YEAR_DATA[year]);

            // Lightbox functionality
            const lightbox = document.getElementById('lightbox');
            const lightboxImg = document.getElementById('lightboxImg');
            const lightboxClose = document.getElementById('lightboxClose');

            function openLightbox(src, alt) {
                lightboxImg.src = src;
                lightboxImg.alt = alt;
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('active');
                document.body.style.overflow = '';
                lightboxImg.src = '';
            }

            // Close lightbox on button click
            lightboxClose.addEventListener('click', closeLightbox);

            // Close lightbox on overlay click
            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) {
                    closeLightbox();
                }
            });

            // Close lightbox on ESC key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.classList.contains('active')) {
                    closeLightbox();
                }
            });
        })();
    </script>
</body>
</html>
