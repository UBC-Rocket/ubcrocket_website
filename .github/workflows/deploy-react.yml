# Builds the React app in /web and deploys it to GitHub Pages.
#
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# NOTE: switching the Pages source replaces the current branch-deployed static site
# at www.ubcrocket.com. Only enable the push trigger below once the React site is ready.
name: Deploy React site to GitHub Pages

on:
  workflow_dispatch:        # run manually from the Actions tab
  # push:
  #   branches: [main]
  #   paths: ['web/**', '.github/workflows/deploy-react.yml']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /   # use /ubcrocket_website/ if serving without the custom domain
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
